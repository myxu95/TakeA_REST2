# REST2 Enhanced Sampling - PLUMED Enabled Configuration
# Configuration with PLUMED files enabled and template specified

# Input files
topology: "example/topol.top"
input_tpr: "example/md.tpr"
md_results_dir: "example"
output_dir: "test_output_with_plumed"

# PLUMED configuration
plumed:
  enable: true                     # PLUMED files enabled
  template: "templates/plumed.dat"  # Template file path (required when enable=true)

# Target selection for REST2 scaling
target_selection: "chainid C"
distance_range: 4.0

# REST2 parameters
n_replicas: 8
temperature:
  min: 300.0
  max: 340.0
temperature_method: "linear"
replex: 1000

# GROMACS settings
gromacs:
  gmx_mpi_command: "gmx_mpi"
  n_cpus: 8
  n_gpus: 4
  script_types: ["slurm", "localrun", "test"]

# Simulation settings
simulation:
  production_time: 100.0 