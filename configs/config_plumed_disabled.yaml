# REST2 Enhanced Sampling - PLUMED Disabled Configuration
# Configuration with PLUMED files disabled

# Input files
topology: "example/topol.top"
input_tpr: "example/md.tpr"
md_results_dir: "example"
output_dir: "300-320K_16_1.5A_output"

# PLUMED configuration
plumed:
  enable: false                    # PLUMED files disabled
  # template: not needed when enable=false

# Target selection for REST2 scaling
target_selection: "chainid C"
distance_range: 1.5

# REST2 parameters
n_replicas: 16
temperature:
  min: 300.0
  max: 320.0
temperature_method: "exponential"  # Exponential temperature distribution
replex: 1000

# GROMACS settings
gromacs:
  gmx_mpi_command: "gmx_mpi"
  n_cpus: 16
  n_gpus: 4
  script_types: ["slurm", "localrun", "test"]

# Simulation settings
simulation:
  production_time: 100.0 